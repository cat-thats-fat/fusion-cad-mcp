name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,corpus]" build hatchling
      - run: python -m pytest
      - run: python -m build --wheel --no-isolation
      - name: Test installed wheel knowledge
        shell: bash
        run: python tests/wheel_knowledge_smoke.py dist/*.whl
