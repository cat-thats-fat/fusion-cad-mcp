[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusion-cad-mcp"
version = "0.3.0"
description = "Robust MCP server for driving Autodesk Fusion. Wraps Fusion's MCP at 127.0.0.1:27182 with named, agent-friendly tools."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Michael Frostbutter" }]
requires-python = ">=3.11"
keywords = ["mcp", "fusion", "autodesk", "cad", "fusion-360"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # MCP 1.30.0 is the tested minimum for the native CallToolResult wire
    # contract with current Pydantic. MCP 1.20 imports a removed Pydantic
    # private helper when paired with Pydantic 2.14. Keep below 2 until the
    # server is ported away from the 1.x FastMCP interface.
    "mcp>=1.30.0,<2",
    "httpx>=0.27",
    "httpx-sse>=0.4,<1",
    "jsonschema>=4.18,<5",
    "referencing>=0.28.4,<1",
]

[project.optional-dependencies]
# Only needed to build the local Fusion API corpus that find_api searches.
# The server itself never imports these, so a plain install stays light and
# tools that do not touch the corpus work without them.
corpus = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "lxml>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
fusion-cad-mcp = "fusion_cad_mcp.server:main"

# src/fusion_cad_mcp/knowledge/*.md ships with the wheel automatically, since
# it lives inside the package tree. That is what makes find_pattern /
# find_gotcha / find_tool work on a plain install. Do not add a force-include
# for it: the files would be added twice and the build fails.
#
# The Autodesk API corpus is deliberately NOT packaged. It is scraped
# third-party content that each user builds locally via
# `fusion-cad-mcp corpus build`.
[tool.hatch.build.targets.wheel]
packages = ["src/fusion_cad_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
